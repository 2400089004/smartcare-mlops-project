apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartcare-api
  labels:
    app: smartcare-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smartcare-api
  template:
    metadata:
      labels:
        app: smartcare-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/smartcare-mlops:VERSION
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: smartcare-api
  labels:
    app: smartcare-api
spec:
  selector:
    app: smartcare-api
  ports:
    - name: http
      port: 3000
      targetPort: http
  type: ClusterIP
